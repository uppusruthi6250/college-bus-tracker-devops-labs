apiVersion: v1
kind: Pod
metadata:
  name: bus-tracker-db-import
  namespace: bus-tracker
spec:
  restartPolicy: Never
  containers:
    - name: importer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: sqlite-data
          mountPath: /data
  volumes:
    - name: sqlite-data
      persistentVolumeClaim:
        claimName: bus-tracker-sqlite
